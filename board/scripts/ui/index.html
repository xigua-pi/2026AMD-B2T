<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeuralType · B2Tnet</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17171a;background:#f4f5f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 3%,#e6edff70,transparent 45%),radial-gradient(ellipse at 100% 95%,#e7eee780,transparent 50%),#f5f5f7}main{max-width:1450px;margin:auto;padding:42px 64px 28px}.brandbar{display:flex;align-items:center;justify-content:space-between;height:32px}.brand{font-size:22px;font-weight:650;letter-spacing:-.6px;display:flex;gap:10px;align-items:center}.icon{display:flex;gap:3px;height:25px;align-items:center}.icon i{width:3px;border-radius:3px;background:#222;display:block}.icon i:nth-child(1),.icon i:nth-child(5){height:11px}.icon i:nth-child(2),.icon i:nth-child(4){height:19px}.icon i:nth-child(3){height:27px}.connection{display:flex;align-items:center;gap:9px;font-size:13px;color:#4d5055}.dot{background:#b2b4ba;width:7px;height:7px;border-radius:50%;display:inline-block}.dot.ok{background:#359b76}.fullscreen{border:0;background:transparent;font-size:23px;margin-left:20px;padding:4px;cursor:pointer;color:#50535a}h1{font-size:58px;letter-spacing:-3px;margin:54px 0 22px;font-weight:700}.glass{background:#ffffff97;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid #fff9;box-shadow:0 12px 50px #32374106;border-radius:27px}.toolbar{display:flex;align-items:center;padding:15px 18px;gap:12px;margin-bottom:22px}.toolbar select{background:transparent;border:none;outline:none;font:inherit;font-size:14px;color:#303238;padding:12px 10px;min-width:130px}.toolbar select:first-child{min-width:228px}.spacer{flex:1}button{font:inherit;border:none;cursor:pointer;background:transparent;color:inherit;border-radius:14px;padding:13px 18px;font-size:14px}button:hover{background:#e9e9edb0}.primary{background:#087cf1;color:white;box-shadow:0 5px 16px #007aff22;padding:14px 24px}.primary:hover{background:#0871dc}.primary:disabled{opacity:.5;cursor:default}.stop{font-size:16px;color:#6b6d72}.gear{font-size:20px}.layout{display:grid;grid-template-columns:1.22fr 1fr;gap:22px}.card{height:450px;padding:25px 26px 20px;display:flex;flex-direction:column;min-width:0}.cardheader{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:17px}.muted{font-size:12px;color:#74777e;font-weight:400}.wavearea{flex:1;min-height:0;padding-top:18px;position:relative}canvas{width:100%;height:100%;display:block}.cardfooter{display:flex;justify-content:space-between;align-items:center;color:#61636a;font-size:12px;margin-top:10px;height:22px}.transcript{font-size:34px;letter-spacing:-.9px;line-height:1.4;margin-top:54px;overflow:auto;flex:1;font-weight:520;white-space:pre-wrap;overflow-wrap:anywhere}.transcript.running:after{content:"";display:inline-block;height:32px;width:2px;margin-left:4px;background:#1478dd;vertical-align:-4px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.copy{padding:1px 4px;color:#81838a;font-size:20px}.progress{height:2px;background:#e8e8ec;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;width:0;background:#789e8b;transition:width .2s linear}.state{display:flex;align-items:center;gap:6px}.reference{font-size:15px;color:#737780;display:none;line-height:1.5;padding-top:14px}.options{display:none;position:absolute;right:70px;top:266px;z-index:3;padding:20px 25px;border-radius:20px;font-size:14px;min-width:210px}.options label{display:block;padding:10px 0}.history{margin-top:20px;color:#777b82;font-size:13px}.history button{padding:8px 0;font-size:13px}#historylist{display:none;padding:10px 0;line-height:1.8;max-height:200px;overflow:auto}.empty{color:#c5c6ca}.error{color:#af3b39}@media(min-width:1600px){main{padding-top:56px}h1{margin-top:70px}.card{height:530px}.transcript{font-size:40px}}@media(max-width:1000px){main{padding:25px}h1{font-size:46px}.layout{grid-template-columns:1fr}.card{height:370px}.toolbar{flex-wrap:wrap}.toolbar select:first-child{min-width:150px}.options{right:25px;top:250px}}
</style></head><body><main><div class="brandbar"><div class="brand"><span class="icon"><i></i><i></i><i></i><i></i><i></i></span>NeuralType</div><div class="connection"><span id="connected" class="dot"></span><span id="connection">正在连接</span><button class="fullscreen" title="全屏" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶</button></div></div><h1>脑控文字</h1><div class="toolbar glass"><select id="record" aria-label="句子"></select><select id="clock" aria-label="时钟"><option value="50">50 MHz</option><option value="10">10 MHz</option><option value="5" selected>5 MHz</option></select><div class="spacer"></div><button id="start" class="primary">▶&nbsp; 开始解码</button><button id="stop" class="stop" title="停止">■</button><button id="next">下一条</button><button class="gear" id="settings" title="设置">☷</button></div><div class="options glass" id="options"><label><input type="checkbox" id="loop"> 连续播放</label><label><input type="checkbox" id="showref"> 显示参考文本</label><label>波形增益 <select id="gain"><option value="4">×4</option><option value="8" selected>×8</option><option value="16">×16</option></select></label></div><div class="layout"><section class="card glass"><div class="cardheader">神经活动<span class="muted">8 通道</span></div><div class="wavearea"><canvas id="wave"></canvas></div><div class="cardfooter"><span id="frames">0 / 0 帧</span><span id="signal">0.00 s</span></div></section><section class="card glass"><div class="cardheader">解码文本<button class="copy" title="复制" id="copy">▢</button></div><div id="text" class="transcript"></div><div id="reference" class="reference"></div><div class="cardfooter"><span class="state"><span id="statusdot" class="dot"></span><span id="status">待开始</span></span><span id="elapsed">0.0 s</span></div><div class="progress"><span id="progress"></span></div></section></div><div class="history"><button id="historybutton">◷&nbsp; 历史记录 <span id="historycount">0</span></button><div id="historylist"></div></div></main><script>
const $=id=>document.getElementById(id);let state={},records=[],busy=false,lastHistory='';const active=()=>['loading','running','between','restoring'].includes(state.status);
async function api(path,body){const r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok)throw Error(v.error||'连接失败');return v}
function wave(){const c=$('wave'),rect=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=rect.width*d;c.height=rect.height*d;const ctx=c.getContext('2d');ctx.scale(d,d);const W=rect.width,H=rect.height,L=34,R=7,B=24;ctx.clearRect(0,0,W,H);const v=state.wave||[],channels=state.channels||[0,12,24,48,72,96,128,160];ctx.font='10px -apple-system,Segoe UI,sans-serif';ctx.lineWidth=1;const row=(H-B)/8;channels.forEach((ch,j)=>{const cy=row*(j+.5);ctx.fillStyle='#898c92';ctx.fillText(String(ch).padStart(3,'0'),0,cy+3);ctx.beginPath();ctx.strokeStyle='#d7d9dd65';ctx.moveTo(L,cy);ctx.lineTo(W-R,cy);ctx.stroke();if(!v.length)return;ctx.beginPath();ctx.strokeStyle='#4f5358';ctx.lineWidth=1.15;v.forEach((a,i)=>{const x=L+(W-L-R)*i/Math.max(1,v.length-1),y=cy-Math.max(-1,Math.min(1,a[j]/127*Number($('gain').value)))*row*.44;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});const t0=(state.wave_start||0)*.02,t1=(state.input_frames||0)*.02;ctx.fillStyle='#95989f';for(let k=0;k<5;k++){const t=t0+(t1-t0)*k/4,x=L+(W-L-R)*k/4;ctx.fillText(t.toFixed(0)+'s',x-6,H-4)}}
function render(s){state=s;$('connected').className='dot ok';$('connection').textContent='PYNQ-Z2 · 已连接';if(active()){$('record').value=s.record;if(s.clock_mhz)$('clock').value=String(Math.round(s.clock_mhz));}$('start').disabled=active();$('next').disabled=active();$('record').disabled=active();$('clock').disabled=active();$('text').textContent=s.text||'';$('text').className='transcript'+(s.status==='running'?' running':'');$('frames').textContent=(s.input_frames||0).toLocaleString()+' / '+(s.total_frames||0).toLocaleString()+' 帧';$('signal').textContent=((s.input_frames||0)*.02).toFixed(2)+' s';$('elapsed').textContent=(s.elapsed_seconds||0).toFixed(1)+' s';$('progress').style.width=(100*(s.input_frames||0)/Math.max(1,s.total_frames||0))+'%';const labels={idle:s.verified?'校验通过':'待开始',loading:'准备中',restoring:'准备中',running:'解码中',between:'已完成',completed:s.verified?'校验通过':'已完成',error:'连接异常'};$('status').textContent=labels[s.status]||'待开始';$('status').className=s.status==='error'?'error':'';$('statusdot').className='dot'+(s.verified?' ok':'');$('reference').textContent=s.reference||'';const h=s.history||[];$('historycount').textContent=h.length;const hs=JSON.stringify(h);if(hs!==lastHistory){lastHistory=hs;$('historylist').replaceChildren(...h.map(r=>{const el=document.createElement('div');el.textContent='第'+String(r.rank||r.record).padStart(3,'0')+'句　'+r.text;return el}))}wave()}
async function poll(){if(busy)return;busy=true;try{render(await api('state'))}catch(e){$('connected').className='dot';$('connection').textContent='未连接';$('start').disabled=true}finally{busy=false}}
$('start').onclick=async()=>{try{await api('control',{action:'start',record:Number($('record').value),clock:Number($('clock').value),loop:$('loop').checked});poll()}catch(e){$('status').textContent=e.message}};
$('stop').onclick=async()=>{await api('control',{action:'stop'});poll()};$('next').onclick=async()=>{if(active()){await api('control',{action:'next'});return}const i=$('record').selectedIndex;$('record').selectedIndex=(i+1)%records.length};$('settings').onclick=()=>{$('options').style.display=$('options').style.display==='block'?'none':'block'};$('showref').onchange=()=>{$('reference').style.display=$('showref').checked?'block':'none'};$('copy').onclick=()=>navigator.clipboard.writeText(state.text||'');$('historybutton').onclick=()=>{$('historylist').style.display=$('historylist').style.display==='block'?'none':'block'};window.addEventListener('resize',wave);
(async()=>{records=await api('records');for(const r of records){const o=document.createElement('option');o.value=r.record;o.textContent='第'+String(r.rank).padStart(3,'0')+'句 · '+r.seconds.toFixed(1)+' s';$('record').append(o)}$('record').selectedIndex=0;await poll();setInterval(poll,180)})().catch(e=>{$('connection').textContent='未连接'});
</script></body></html>
